name: CI

on:
  push:
    branches: [main, feature/ci-pipeline]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .